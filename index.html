*{box-sizing:border-box;margin:0;font:13px/1.45 -apple-system,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif}

}

select option{color:#000}

.pm{position:fixed;z-index:8000;min-width:170px;padding:6px;border-radius:14px}

#ck{font-size:96px;font-weight:200;letter-spacing:-2px}

/* ---------- NangaiOS desktop shell ---------- */
:root{--na-accent:#a9a5ff;--na-panel:rgba(18,21,39,.58)}
body{background:#080a16}
#scr{background-position:center;filter:saturate(1.04)}

 .di.voice{background:linear-gradient(145deg,#53e1d5,#2563eb 55%,#7038d9)}

 overflow:hidden!important;box-sizing:border-box

 width:100%!important;height:100%!important;min-width:0!important;min-height:0!important;

}

  el.addEventListener('pointermove',e=>{if(!drag||drag.el!==el||drag.id!==e.pointerId)return;const dx=e.clientX-drag.startX,dy=e.clientY-drag.startY;if(!drag.moved&&Math.hypot(dx,dy)<5)return;drag.moved=true;el.classList.add('dragging');const a=desktopArea.getBoundingClientRect();placeIcon(el,(e.clientX-a.left)/drag.scale-drag.offsetX,(e.clientY-a.top)/drag.scale-drag.offsetY,false);});
  const finish=e=>{if(!drag||drag.el!==el||drag.id!==e.pointerId)return;if(drag.moved){placeIcon(el,parseFloat(el.style.left)||0,parseFloat(el.style.top)||0,true);suppressClickUntil=Date.now()+350;setTimeout(()=>el.classList.remove('dragging'),0)}drag=null};
  el.addEventListener('pointerup',finish);el.addEventListener('pointercancel',finish);
  el.addEventListener('click',e=>{if(Date.now()<suppressClickUntil){e.preventDefault();e.stopImmediatePropagation()}},true);
 });
}

/* iOS visualViewport + soft-keyboard layout synchronization */
(function(){
 const vv=window.visualViewport;let keyboardOpen=false;const saved=new WeakMap();
 function syncViewport(){
  const height=vv?vv.height:window.innerHeight,top=vv?vv.offsetTop:0;
  document.documentElement.style.setProperty('--nangai-vv-height',Math.max(180,height)+'px');
  document.documentElement.style.setProperty('--nangai-vv-top',Math.max(0,top)+'px');
  const active=document.activeElement;
  const isTextEntry=!!active&&(/^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName)||active.isContentEditable);
  const visible=!!vv&&window.innerHeight-height>145&&isTextEntry;
  if(visible!==keyboardOpen){keyboardOpen=visible;document.body.classList.toggle('keyboard-open',keyboardOpen)}
  document.querySelectorAll('.win').forEach(w=>{
   if(keyboardOpen){
    if(!saved.has(w))saved.set(w,{top:w.style.top,left:w.style.left,height:w.style.height,width:w.style.width});
    const r=w.getBoundingClientRect();
    if(r.bottom>top+height-8)w.style.top=Math.max(top,top+height-r.height-8)+'px';
    if(r.top<top)w.style.top=top+'px';
    w.style.maxHeight=Math.max(160,height-12)+'px';
   }else{
    const old=saved.get(w);
    if(old){w.style.top=old.top;w.style.left=old.left;w.style.height=old.height;w.style.width=old.width;w.style.maxHeight='';saved.delete(w)}
   }
  });
  if(keyboardOpen&&active)requestAnimationFrame(()=>{try{active.scrollIntoView({block:'nearest',inline:'nearest',behavior:'auto'})}catch(e){}});
 }
 if(vv){vv.addEventListener('resize',syncViewport);vv.addEventListener('scroll',syncViewport)}
 window.addEventListener('resize',syncViewport);
 document.addEventListener('focusin',e=>{if(e.target.matches('input,textarea,select,[contenteditable="true"]'))setTimeout(syncViewport,80)});
 document.addEventListener('focusout',()=>setTimeout(syncViewport,220));
 syncViewport();
})();

setWP(st.wp);setLG(st.lg);setBR(st.br);document.documentElement.style.setProperty('--ui-scale',String((st.uiScale||100)/100));power('boot');
</script>
