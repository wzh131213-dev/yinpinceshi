<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>NangaiOS · 网页电脑操作系统</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101225"><meta name="description" content="NangaiOS：运行在浏览器中的液态玻璃桌面操作系统">
<style>
*{box-sizing:border-box;margin:0;font:13px/1.45 -apple-system,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif}
html,body{height:100%;overflow:hidden;background:#000;color:#fff;-webkit-user-select:none;user-select:none}
input,textarea,.m,.tm,iframe{-webkit-user-select:text;user-select:text}
:root{--bf:blur(18px) saturate(1.8) brightness(1.1)}
#scr{position:fixed;inset:0;background-size:150% 150%;animation:mv 30s ease-in-out infinite alternate}
@keyframes mv{to{background-position:100% 100%}}
@media(prefers-reduced-motion){#scr{animation:none}}
.g{background:rgba(30,32,44,.92);border:1px solid rgba(255,255,255,.14);box-shadow:0 12px 40px rgba(0,0,0,.4)}
body.lg .g{background:rgba(60,70,110,.2);-webkit-backdrop-filter:var(--bf);backdrop-filter:var(--bf);border-color:rgba(255,255,255,.3);box-shadow:inset 2px 2px 1px -1px rgba(255,255,255,.75),inset -1px -1px 1px rgba(255,255,255,.3),inset 0 0 26px rgba(255,255,255,.1),0 14px 44px rgba(0,0,0,.3)}
#mb{position:fixed;top:6px;left:8px;right:8px;height:30px;border-radius:15px;display:flex;align-items:center;gap:10px;padding:0 10px;z-index:5000;text-shadow:0 1px 3px rgba(0,0,0,.5)}
#mb .sp{flex:1}
#mb button{background:none;border:0;color:inherit;cursor:pointer;padding:2px 9px;border-radius:9px;text-shadow:inherit}
#mb button:hover{background:rgba(255,255,255,.2)}
#dk{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:10px;padding:8px 12px;border-radius:26px;z-index:5000}
#dk button{position:relative;width:52px;height:52px;border:0;border-radius:14px;font-size:27px;background:linear-gradient(145deg,var(--a),var(--b));cursor:pointer;transition:transform .22s cubic-bezier(.3,1.6,.5,1);box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 4px 10px rgba(0,0,0,.3)}
#dk button:hover{transform:translateY(-10px) scale(1.25)}
#dk u{position:absolute;bottom:-6px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#fff;display:none}
#dk .on u{display:block}
.win{position:fixed;border-radius:14px;overflow:hidden;resize:both;display:flex;flex-direction:column;min-width:260px;min-height:170px;animation:pop .25s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop{from{transform:scale(.88);opacity:0}}
.win.mx{inset:44px 8px 84px 8px!important;width:auto!important;height:auto!important}
.tb{height:34px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;cursor:grab;touch-action:none}
.tb i{width:12px;height:12px;border-radius:50%;cursor:pointer;flex:none}
.tb b{flex:1;text-align:center;font-weight:600;margin-right:44px}
.win:not(.f) .tb{opacity:.6}
.wb{flex:1;min-height:0;overflow:auto;background:rgba(14,16,24,.55)}
.col{display:flex;flex-direction:column;height:100%}
.bar{display:flex;gap:8px;padding:8px;align-items:center;flex:none}
.bt,.in{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:8px;padding:4px 10px;outline:0}
.bt{cursor:pointer}.bt:hover{background:rgba(255,255,255,.3)}
select option{color:#000}
.sp{flex:1;display:flex;min-height:0}
textarea{flex:1;min-width:0;resize:none;border:0;outline:0;background:rgba(0,0,0,.3);color:#d6e4ff;font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;padding:10px;tab-size:2;white-space:pre}
iframe{flex:1;min-width:0;border:0;background:#0d1117;border-left:1px solid rgba(255,255,255,.15)}
.ch{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:88%;padding:8px 12px;border-radius:14px;white-space:pre-wrap;word-break:break-word}
.m.u{align-self:flex-end;background:rgba(80,140,255,.75)}.m.a{align-self:flex-start;background:rgba(255,255,255,.16)}
.m pre{background:rgba(0,0,0,.45);padding:8px;border-radius:8px;overflow:auto;font:12px ui-monospace,Menlo,monospace;margin:6px 0}
.tm{padding:10px;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#9fffc0;cursor:text}
.tm *{font:inherit}.tm div{white-space:pre-wrap}
.tm input{background:none;border:0;outline:0;color:#fff;width:100%}
.fi{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid rgba(255,255,255,.08);cursor:default}
.fi:hover{background:rgba(255,255,255,.12)}.fi small{margin-left:auto;opacity:.6}
.st{padding:14px}.st h4{margin-bottom:8px}
.wg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.wg i,.up{width:96px;height:60px;border-radius:10px;background-size:cover;cursor:pointer;border:2px solid rgba(255,255,255,.3)}
.wg i:hover{border-color:#fff}
.up{display:grid;place-items:center;font-size:22px;background:rgba(255,255,255,.12)}
.row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;margin-bottom:8px;border-radius:12px;background:rgba(255,255,255,.1)}
.row small{opacity:.7}
.sw{width:46px;height:28px;border-radius:14px;background:rgba(255,255,255,.28);position:relative;cursor:pointer;transition:.25s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.25s cubic-bezier(.3,1.5,.5,1);box-shadow:0 2px 5px rgba(0,0,0,.3)}
.sw.on{background:#34c759}.sw.on:after{left:21px}
.pm{position:fixed;z-index:8000;min-width:170px;padding:6px;border-radius:14px}
.mi{padding:6px 12px;border-radius:8px;cursor:default}.mi:hover{background:rgba(255,255,255,.22)}
#dm{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:9500}
#pw{position:fixed;inset:0;z-index:9000;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .7s}
#pw>*{display:none}
#pw[data-s=boot] .lo1,#pw[data-s=boot] .pr{display:block}
#pw[data-s=off] #pb{display:grid}
#pw[data-s=lock] .lk{display:block;text-align:center;text-shadow:0 2px 16px rgba(0,0,0,.4)}
#pw[data-s=lock]{background:rgba(0,0,0,.25);-webkit-backdrop-filter:blur(28px);backdrop-filter:blur(28px)}
#pw[data-s=""]{opacity:0;pointer-events:none;background:transparent}
.lo1{font-size:64px}
.pr{width:180px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden}
.pr i{display:block;height:100%;width:0;background:#fff}
#pw[data-s=boot] .pr i{animation:ld 2.4s cubic-bezier(.5,0,.3,1) forwards}
@keyframes ld{to{width:100%}}
#pb{width:64px;height:64px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:none;color:#fff;font-size:28px;cursor:pointer;place-items:center}
#ck{font-size:96px;font-weight:200;letter-spacing:-2px}

/* ---------- NangaiOS desktop shell ---------- */
:root{--na-accent:#a9a5ff;--na-panel:rgba(18,21,39,.58)}
body{background:#080a16}
#scr{background-position:center;filter:saturate(1.04)}
#mb{height:36px;top:8px;left:12px;right:12px;padding:0 12px;gap:9px;border-radius:13px;background:rgba(13,16,32,.48);border-color:rgba(255,255,255,.22);backdrop-filter:blur(26px) saturate(1.65);-webkit-backdrop-filter:blur(26px) saturate(1.65)}
#mb #lo{width:25px;height:25px;padding:0;border-radius:8px;font-size:15px;font-weight:800;color:#fff;background:linear-gradient(140deg,#a99cff,#55d8ff);box-shadow:0 2px 9px #5d63ff55;text-shadow:none}
#brandName{font-size:12px;font-weight:750;letter-spacing:.15px;white-space:nowrap}
#mb .sep{height:17px;width:1px;background:rgba(255,255,255,.2);margin:0 2px}
#mb #an{font-size:12px;font-weight:550;opacity:.86}
#mb #lgb{white-space:nowrap;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);border-radius:8px}
#mb #sysmark{opacity:.76;white-space:nowrap}
#cl{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600;font-size:12px}
#desktop{position:fixed;inset:50px 0 82px;z-index:1;pointer-events:none;color:#fff;text-shadow:0 1px 5px #0008}
.brand-stamp{position:absolute;left:25px;top:13px;display:flex;align-items:center;gap:10px;pointer-events:none}
.brand-stamp .mark{display:grid;place-items:center;width:35px;height:35px;border-radius:12px;background:linear-gradient(140deg,#a99cff,#4ed8f4);box-shadow:0 7px 24px #6768ff45;font-size:18px;font-weight:850;color:#fff;text-shadow:none}
.brand-stamp strong{display:block;font-size:13px;letter-spacing:.1px}
.brand-stamp small{display:block;margin-top:2px;font-size:9px;letter-spacing:1.4px;opacity:.68}
#desktopApps{position:absolute;left:18px;top:69px;display:grid;grid-template-columns:repeat(1,84px);gap:8px;pointer-events:auto}
.desk-icon{width:80px;min-height:78px;border:1px solid transparent;border-radius:13px;padding:7px 4px 6px;background:transparent;color:#fff;display:flex;align-items:center;flex-direction:column;gap:5px;cursor:pointer;text-shadow:0 2px 5px #000a;transition:background .15s,border-color .15s;touch-action:manipulation}
.desk-icon:hover,.desk-icon.selected{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.22)}
.desk-icon .di{display:grid;place-items:center;width:43px;height:43px;border-radius:13px;font-size:23px;box-shadow:inset 0 1px 1px #ffffff80,0 6px 14px #0004;border:1px solid #ffffff25;text-shadow:none}
.desk-icon .label{font-size:11px;line-height:1.2;text-align:center;max-width:76px;overflow-wrap:anywhere}
.di.files{background:linear-gradient(145deg,#6edcff,#2879fa)}.di.code{background:linear-gradient(145deg,#58bbff,#6557ee)}.di.term{background:linear-gradient(145deg,#384155,#101522)}.di.ai{background:linear-gradient(145deg,#ff9fe7,#8d68ff)}.di.set{background:linear-gradient(145deg,#cad4e7,#67738d)}.di.notes{background:linear-gradient(145deg,#ffe995,#ffac53)}
#deskWidget{position:absolute;right:26px;top:16px;width:244px;padding:17px 18px 15px;border-radius:20px;background:rgba(20,23,43,.32);border:1px solid rgba(255,255,255,.24);box-shadow:inset 1px 1px 0 #ffffff26,0 14px 40px #0002;backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);text-shadow:none;pointer-events:none}
#deskWidget .dw-eyebrow{font-size:10px;letter-spacing:1px;text-transform:uppercase;opacity:.72}
#heroTime{font-size:39px;font-weight:250;letter-spacing:-1.5px;line-height:1.2;margin:7px 0 2px;font-variant-numeric:tabular-nums}
#heroDate{font-size:12px;opacity:.9}
#deskWidget .dw-line{height:1px;background:rgba(255,255,255,.18);margin:13px 0 11px}
#deskWidget .dw-status{display:flex;gap:7px;align-items:center;font-size:11px;opacity:.9}
#deskWidget .status-dot{width:6px;height:6px;border-radius:50%;background:#67e8a5;box-shadow:0 0 9px #67e8a5}
#deskWidget .dw-foot{margin-top:7px;font-size:10px;opacity:.58}
.win{border:1px solid rgba(255,255,255,.25);border-radius:15px;box-shadow:0 24px 70px #0006,inset 0 1px 0 #ffffff25;backdrop-filter:blur(24px) saturate(1.25);-webkit-backdrop-filter:blur(24px) saturate(1.25)}
.tb{height:40px;background:rgba(255,255,255,.055);border-bottom:1px solid rgba(255,255,255,.1);cursor:grab}
.tb:active{cursor:grabbing}
.tb i{width:12px;height:12px;box-shadow:inset 0 0 0 1px #0002}
.tb b{font-size:12px;letter-spacing:.1px}
.wb{background:rgba(11,14,25,.7)}
#dk{gap:9px;padding:9px 12px 10px;border-radius:20px;max-width:calc(100vw - 18px);overflow:visible;background:rgba(16,19,36,.4);backdrop-filter:blur(28px) saturate(1.8);-webkit-backdrop-filter:blur(28px) saturate(1.8);border-color:rgba(255,255,255,.28);box-shadow:inset 0 1px 0 #ffffff35,0 16px 50px #0003}
#dk button{width:50px;height:50px;border-radius:14px;flex:none}
#dk button:focus-visible,.desk-icon:focus-visible,#mb button:focus-visible{outline:2px solid #fff;outline-offset:2px}
#dk u{bottom:-5px}
.pm{background:rgba(20,23,40,.82)!important;backdrop-filter:blur(25px) saturate(1.7);-webkit-backdrop-filter:blur(25px) saturate(1.7);border-color:rgba(255,255,255,.22);box-shadow:0 16px 45px #0006}
.mi{padding:8px 12px;font-size:12px}
#pw .lo1{font-size:48px;font-weight:850;letter-spacing:-3px;width:86px;height:86px;display:grid;place-items:center;border-radius:27px;background:linear-gradient(140deg,#a99cff,#55d8ff);box-shadow:0 10px 45px #7476ff58;text-shadow:0 2px 10px #0002}
#pw[data-s=boot] .lo1,#pw[data-s=boot] .pr{display:block}
#pw[data-s=boot] .lo1{display:grid}
#pw .pr{margin-top:0}
#pw[data-s=lock] .lk{line-height:1.7}
#pw .lk:after{content:'NangaiOS';display:block;font-size:12px;letter-spacing:2px;opacity:.7;margin-top:8px}
#pb{box-shadow:0 0 0 7px #ffffff0a,inset 0 0 0 1px #ffffff25}
.st h4{font-size:15px}
.fi{min-height:40px}
@media(max-width:700px){
 #mb{left:6px;right:6px;gap:5px;padding:0 7px}
 #brandName{font-size:11px}
 #mb #lgb{font-size:10px;padding:2px 5px;max-width:88px;overflow:hidden}
 #mb #sysmark{display:none}
 #cl{font-size:10px}
 #desktop{inset:48px 0 78px}
 .brand-stamp{left:13px;top:9px}
 #desktopApps{left:7px;top:66px;grid-template-columns:repeat(1,68px);gap:3px}
 .desk-icon{width:65px;min-height:68px;padding:4px 2px;gap:4px}
 .desk-icon .di{width:38px;height:38px;font-size:20px;border-radius:12px}
 .desk-icon .label{font-size:10px}
 #deskWidget{right:10px;top:12px;width:min(202px,calc(100vw - 108px));padding:12px;border-radius:16px}
 #heroTime{font-size:30px}
 #deskWidget .dw-foot{font-size:9px}
 #dk{bottom:7px;gap:6px;padding:7px 8px 8px;border-radius:18px}
 #dk button{width:42px;height:42px;font-size:22px;border-radius:12px}
 .win{min-width:min(260px,calc(100vw - 12px))}
 .win.mx{inset:48px 5px 70px 5px!important}
}
@media(max-width:390px){#lgb{display:none!important}#deskWidget{width:calc(100vw - 102px)}#dk{gap:4px;padding:6px}#dk button{width:37px;height:37px;font-size:20px}}


/* ---------- Layout width guard: prevent app/window horizontal overflow ---------- */
.win{max-width:calc(100vw - 16px);min-width:min(260px,calc(100vw - 12px))}
.win.mx{left:8px!important;right:8px!important;min-width:0!important;max-width:none!important;resize:none}
.wb{width:100%;max-width:100%;min-width:0}
.games-app{width:100%;max-width:100%;min-width:0;box-sizing:border-box}
.games-head,.games-grid,.game-player,.game-playerbar,.game-framebox{min-width:0;max-width:100%}
.games-grid{width:100%;grid-template-columns:repeat(2,minmax(0,1fr))}
.game-tile{min-width:0;max-width:100%;overflow:hidden}
.game-info,.game-info strong,.game-info small{min-width:0;max-width:100%;overflow-wrap:anywhere}
.game-framebox{width:100%}
.game-frame{width:100%;max-width:100%}
@media(max-width:700px){
 .win{max-width:calc(100vw - 12px)}
 .win.mx{left:5px!important;right:5px!important;min-width:0!important;max-width:none!important}
 .games-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
 
/* ---------- Rebuilt adaptive game viewport ---------- */
.win.game-active{
 display:flex!important;flex-direction:column!important;
 width:var(--game-window-width,100%);min-width:0!important;min-height:0!important;
 overflow:hidden!important;box-sizing:border-box
}
.win.game-active>.tb{flex:0 0 42px}
.win.game-active>.wb{
 display:flex!important;flex:1 1 0!important;flex-direction:column!important;
 width:100%!important;height:auto!important;min-width:0!important;min-height:0!important;
 overflow:hidden!important;box-sizing:border-box
}
.win.game-active .games-app{
 display:flex!important;flex:1 1 0!important;flex-direction:column!important;
 width:100%!important;height:100%!important;min-width:0!important;min-height:0!important;
 max-width:100%!important;overflow:hidden!important;box-sizing:border-box;padding:8px!important
}
.win.game-active .games-head{flex:0 0 auto!important}
.win.game-active .games-note:not(.game-error-note){flex:0 0 auto!important}
.win.game-active .game-player{
 display:flex!important;flex:1 1 0!important;flex-direction:column!important;
 width:100%!important;height:auto!important;min-width:0!important;min-height:0!important;
 overflow:hidden!important;box-sizing:border-box
}
.win.game-active .game-playerbar{
 display:flex!important;flex:0 0 auto!important;flex-wrap:wrap;align-items:center;
 width:100%!important;max-width:100%!important;min-width:0!important;box-sizing:border-box
}
.win.game-active .game-framebox{
 position:relative!important;display:block!important;flex:1 1 0!important;
 width:100%!important;height:auto!important;min-width:0!important;min-height:0!important;
 max-width:100%!important;max-height:none!important;overflow:hidden!important;
 padding:0!important;margin:0!important;box-sizing:border-box
}
.win.game-active iframe.game-frame{
 position:absolute!important;inset:0!important;display:block!important;
 width:100%!important;height:100%!important;min-width:0!important;min-height:0!important;
 max-width:none!important;max-height:none!important;padding:0!important;margin:0!important;
 border:0!important;box-sizing:border-box
}
.win.game-active .game-error-note{flex:0 0 auto;max-width:100%;min-width:0;max-height:48px;overflow:auto}
@media(max-width:700px){
 .win.game-active>.tb{flex-basis:46px}
 .win.game-active.mx{left:5px!important;right:5px!important}
 .win.game-active .games-app{padding:5px!important}
}
 
/* ---------- Game launcher cards ---------- */
.games-app{padding:16px;background:linear-gradient(145deg,rgba(15,22,44,.96),rgba(26,19,48,.92));color:#f8fafc;min-height:100%;font-family:inherit}
.games-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.games-head h2{font-size:20px;font-weight:800;letter-spacing:.2px}
.games-head p{font-size:11px;opacity:.68;margin-top:3px}
.games-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.game-tile{display:flex;flex-direction:column;min-width:0;overflow:hidden;text-decoration:none;color:inherit;border-radius:15px;border:1px solid rgba(255,255,255,.15);background:linear-gradient(145deg,rgba(255,255,255,.105),rgba(255,255,255,.035));transition:transform .18s,border-color .18s,background .18s;box-shadow:0 9px 24px rgba(0,0,0,.16)}
.game-tile:hover{transform:translateY(-3px);border-color:rgba(155,185,255,.7);background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.06))}
.game-art{height:94px;display:grid;place-items:center;font-size:42px;position:relative;overflow:hidden;background:var(--game-bg)}
.game-art:before,.game-art:after{content:"";position:absolute;width:125px;height:125px;border:1px solid #ffffff22;border-radius:50%;transform:translate(42px,24px)}
.game-art:after{width:82px;height:82px;transform:translate(-48px,-24px)}
.game-art span{filter:drop-shadow(0 5px 7px #0005);z-index:1}
.game-info{padding:10px;display:flex;flex-direction:column;gap:5px;flex:1}
.game-info strong{font-size:13px;font-weight:750}
.game-info small{font-size:10px;opacity:.62;overflow-wrap:anywhere}
.game-launch{margin-top:5px;display:flex;align-items:center;justify-content:center;gap:5px;padding:7px 8px;border-radius:9px;background:rgba(139,160,255,.18);border:1px solid rgba(160,175,255,.25);font-size:11px;font-weight:700}
.game-tile:hover .game-launch{background:rgba(139,160,255,.32)}
.games-note{margin-top:12px;font-size:10px;opacity:.55;text-align:center}
@media(max-width:420px){.games-app{padding:10px}.games-grid{gap:8px}.game-art{height:76px;font-size:35px}.game-info{padding:8px}.game-info strong{font-size:12px}}

 b.innerHTML=`<h4>显示与外观</h4><div class=row style="display:block"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px"><span>🔎 网页显示大小</span><strong id="uiScaleValue">${st.uiScale||100}%</strong></div><input id="uiScaleRange" aria-label="网页显示大小" type=range min=40 max=160 step=1 value=${st.uiScale||100} style="width:100%;accent-color:#a9a5ff"><div style="display:flex;justify-content:space-between;opacity:.65;font-size:10px;margin-top:4px"><span>40%</span><span>100%</span><span>160%</span></div><div style="font-size:10px;opacity:.65;margin-top:7px">连续拖动调节桌面显示；游戏大厅和游戏画面不受影响。</div></div><h4 style="margin-top:16px">壁纸</h4><div class=wg>${WP.map((w,i)=>`<i data-i=${i} style="background-image:${w}"></i>`).join('')}<label class=up>＋<input type=file accept="image/*" hidden></label></div><div class=row>💧 液态玻璃<span class="sw${st.lg?' on':''}"></span></div><div class=row>🔆 亮度<input type=range min=30 max=100 value=${st.br}></div><div class=row>🖥 本机<small>${navigator.hardwareConcurrency||'?'} 核 · ${innerWidth}×${innerHeight} · NangaiOS 1.0</small></div>`;
 b.onclick=e=>{const i=e.target.dataset.i;if(i!=null)setWP(+i);if(e.target.closest('.sw'))setLG(!st.lg)};
 $('input[type=file]',b).onchange=e=>{const f=e.target.files[0];if(f)setWP(-1,URL.createObjectURL(f))};
 const sliders=b.querySelectorAll('input[type=range]');sliders[0].oninput=e=>setUIScale(e.target.value);sliders[1].oninput=e=>setBR(+e.target.value)
}

/* ---------- 游戏大厅：从个人网站提取的 6 个游戏快捷入口 ---------- */
function fGames(b){
 const games=[
  {name:'Minecraft',sub:'方块世界',url:'https://wzh131213-dev.github.io/mc.github.io/',emoji:'⛏️',bg:'radial-gradient(circle at 25% 20%,#9be15d,#159957 58%,#153d38)'},
  {name:'公路之王',sub:'赛车竞速',url:'https://wzh131213-dev.github.io/wzh131213-dev-games.github.io/',emoji:'🏎️',bg:'radial-gradient(circle at 70% 20%,#ffdf7e,#ff6b35 48%,#5d174d)'},
  {name:'修仙世界',sub:'东方幻想',url:'https://wzh131213-dev.github.io/xiuxianshijie.github.io/',emoji:'🗡️',bg:'radial-gradient(circle at 50% 20%,#d8b4fe,#6d28d9 52%,#111827)'},
  {name:'Cession',sub:'游戏项目',url:'https://wzh131213-dev.github.io/cession.github.io/',emoji:'⚔️',bg:'radial-gradient(circle at 25% 25%,#67e8f9,#2563eb 48%,#172554)'},
  {name:'Hi1 游戏',sub:'独立游戏',url:'https://wzh131213-dev.github.io/hi1.github.io/',emoji:'🕹️',bg:'radial-gradient(circle at 70% 20%,#f9a8d4,#9333ea 50%,#312e81)'},
  {name:'Disheng',sub:'游戏项目',url:'https://wzh131213-dev.github.io/disheng.github.io/?utm_source=chatgpt.com',emoji:'🐉',bg:'radial-gradient(circle at 30% 20%,#fda4af,#be123c 48%,#3f1028)'},
  {name:'PolyTrack',sub:'选择游戏版本',url:'',emoji:'🏁',bg:'radial-gradient(circle at 25% 20%,#7dd3fc,#2563eb 48%,#172554)',choices:[{name:'有存档',url:'https://poki.com/zh/g/polytrack#fullscreen',desc:'Poki 版本 · 支持存档'},{name:'无存档无屏蔽',url:'https://sites.google.com/view/newcargame/poly-track-0-6-0?authuser=0',desc:'备用版本 · 无存档无屏蔽'}]},
 ];
 b.innerHTML='<div class="games-app"><div class="games-head"><div><h2>🎮 游戏大厅</h2><p>游戏直接在 NangaiOS 窗口内运行</p></div><span style="font-size:11px;opacity:.65">7 GAMES</span></div><div class="games-grid">'+games.map((g,i)=>'<button type="button" class="game-tile" data-game="'+i+'"><div class="game-art" style="--game-bg:'+g.bg+'"><span>'+g.emoji+'</span></div><div class="game-info"><strong>'+g.name+'</strong><small>'+g.sub+'</small><span class="game-launch">在本窗口启动 <span aria-hidden="true">▶</span></span></div></button>').join('')+'</div><div class="games-note">不会主动打开新标签页。若游戏站点禁止 iframe 嵌入，窗口内可能无法加载。</div><div class="poly-choices" hidden><div class="poly-choice-head"><button type="button" class="bt poly-back">← 返回游戏大厅</button><div><h3>🏁 PolyTrack</h3><p>请选择要启动的游戏版本</p></div></div><div class="poly-choice-list"><button type="button" class="poly-choice" data-poly-choice="0"><span class="poly-choice-icon">💾</span><span class="poly-choice-copy"><strong>有存档</strong><small>Poki 版本 · 支持存档</small></span><span class="poly-choice-arrow">›</span></button><button type="button" class="poly-choice" data-poly-choice="1"><span class="poly-choice-icon">🏎️</span><span class="poly-choice-copy"><strong>无存档无屏蔽</strong><small>备用版本 · 无存档无屏蔽</small></span><span class="poly-choice-arrow">›</span></button></div><div class="games-note">选择后会尝试在 NangaiOS 当前窗口内加载。</div></div><div class="game-player" hidden><div class="game-playerbar"><button type="button" class="bt game-back">← 返回游戏大厅</button><strong class="game-current">游戏</strong><button type="button" class="bt game-reload">↻ 重新加载</button><button type="button" class="bt game-full">⛶ 全屏</button><button type="button" class="bt game-open" hidden>↗ 在新标签页打开游戏</button></div><div class="game-framebox"><div class="game-loading">正在加载游戏…</div><iframe class="game-frame" title="内嵌游戏" allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write; accelerometer; gyroscope; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div><div class="games-note game-error-note">如果页面显示拒绝连接，说明该游戏站点限制了内嵌运行，需要调整游戏站点的安全设置或将游戏源码集成进本项目。</div></div></div>';
 const root=b.querySelector('.games-app'),grid=root.querySelector('.games-grid'),player=root.querySelector('.game-player'),frame=root.querySelector('.game-frame'),title=root.querySelector('.game-current'),loading=root.querySelector('.game-loading');
 const choices=root.querySelector('.poly-choices');
 const launchGame=(g,url,name)=>{
  choices.hidden=true;grid.hidden=true;root.querySelector('.games-note').hidden=true;player.hidden=false;
  const hostWin=root.closest('.win');if(hostWin){hostWin.classList.add('game-active');requestAnimationFrame(()=>{const sync=()=>{const box=root.querySelector('.game-framebox');if(!box)return;const r=box.getBoundingClientRect();frame.style.width=Math.max(1,Math.round(r.width))+'px';frame.style.height=Math.max(1,Math.round(r.height))+'px';frame.style.width='100%';frame.style.height='100%';};sync();if(window.ResizeObserver){if(hostWin._gameSizeObserver)hostWin._gameSizeObserver.disconnect();hostWin._gameSizeObserver=new ResizeObserver(sync);hostWin._gameSizeObserver.observe(hostWin);hostWin._gameSizeObserver.observe(root.querySelector('.game-framebox'));}window.addEventListener('resize',sync,{passive:true});});}
  title.textContent=g.emoji+' '+name;loading.style.display='grid';root.querySelector('.game-open').hidden=false;root.querySelector('.game-open').onclick=()=>window.open(url,'_blank','noopener');frame.src='about:blank';
  loading.textContent='正在加载游戏…';
  setTimeout(()=>{frame.src=url},30);
  setTimeout(()=>{if(!player.hidden&&loading.style.display!=='none'){loading.textContent='加载时间较长，游戏站点可能不支持内嵌。可点击上方“在新标签页打开游戏”继续。';root.querySelector('.game-open').hidden=false;}},10000);
 };
 root.querySelectorAll('[data-game]').forEach(btn=>btn.onclick=()=>{
  const g=games[Number(btn.dataset.game)];if(!g)return;
  if(g.choices){grid.hidden=true;root.querySelector('.games-note').hidden=true;player.hidden=true;choices.hidden=false;const hostWin=root.closest('.win');if(hostWin)hostWin.classList.remove('game-active');return;}
  launchGame(g,g.url,g.name);
 });
 root.querySelectorAll('[data-poly-choice]').forEach(btn=>btn.onclick=()=>{
  const choice=games[6].choices[Number(btn.dataset.polyChoice)];if(!choice)return;
  launchGame(games[6],choice.url,'PolyTrack · '+choice.name);
 });
 root.querySelector('.poly-back').onclick=()=>{choices.hidden=true;grid.hidden=false;root.querySelector('.games-note').hidden=false};
 root.querySelector('.game-back').onclick=()=>{frame.src='about:blank';player.hidden=true;choices.hidden=true;grid.hidden=false;const hostWin=root.closest('.win');if(hostWin){hostWin.classList.remove('game-active');if(hostWin._gameSizeObserver){hostWin._gameSizeObserver.disconnect();hostWin._gameSizeObserver=null;}}root.querySelector('.games-note').hidden=false};
 root.querySelector('.game-reload').onclick=()=>{loading.style.display='grid';loading.textContent='正在重新加载游戏…';const u=frame.src;frame.src='about:blank';setTimeout(()=>frame.src=u,30);setTimeout(()=>{if(!player.hidden&&loading.style.display!=='none'){loading.textContent='加载时间较长，游戏站点可能不支持内嵌。可点击上方“在新标签页打开游戏”继续。';root.querySelector('.game-open').hidden=false;}},10000)};
 frame.addEventListener('load',()=>{if(frame.src!=='about:blank')loading.style.display='none'});
 root.querySelector('.game-full').onclick=()=>{const box=root.querySelector('.game-framebox');if(box.requestFullscreen)box.requestFullscreen();else if(frame.requestFullscreen)frame.requestFullscreen()};
}

const A={
 code:{t:'代码',i:'💻',c:['#4f8cff','#7a5cff'],w:720,h:440,f:fCode},
 ai:{t:'AI 助手',i:'✨',c:['#ff7ac8','#ff9f5a'],w:420,h:520,f:fAI},
 term:{t:'终端',i:'⌨️',c:['#2b2f3a','#12141b'],w:560,h:340,f:fTerm},
 notes:{t:'便签',i:'📝',c:['#ffe995','#ffac53'],w:420,h:360,f:fNotes},
 files:{t:'文件',i:'📁',c:['#3ec6ff','#2a7bff'],w:440,h:320,f:fFiles},
 set:{t:'设置',i:'⚙️',c:['#9aa4b8','#5d667a'],w:540,h:420,f:fSet},
 games:{t:'游戏大厅',i:'🎮',c:['#ffb86c','#f43f8e'],w:1400,h:1000,f:fGames},
};
$('#dk').innerHTML=Object.entries(A).map(([k,a])=>`<button data-id="${k}" title="${a.t}" style="--a:${a.c[0]};--b:${a.c[1]}">${a.i}<u></u></button>`).join('');
$('#dk').onclick=e=>{const b=e.target.closest('button');if(b)launch(b.dataset.id)};
const deskApps=$('#desktopApps');
if(deskApps){
 deskApps.addEventListener('click',e=>{const b=e.target.closest('[data-app]');if(!b)return;document.querySelectorAll('.desk-icon').forEach(x=>x.classList.toggle('selected',x===b));if(matchMedia('(pointer: coarse)').matches)launch(b.dataset.app)});
 deskApps.addEventListener('dblclick',e=>{const b=e.target.closest('[data-app]');if(b)launch(b.dataset.app)});
}

setWP(st.wp);setLG(st.lg);setBR(st.br);document.documentElement.style.setProperty('--ui-scale',String((st.uiScale||100)/100));power('boot');
</script></body></html>
