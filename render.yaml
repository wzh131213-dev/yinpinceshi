services:
  - type: web
    name: nangaios-cloud-runtime
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: EMUTIZE_API_KEY
        sync: false
      - key: APP_ACCESS_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: EMUTIZE_BASE_URL
        value: https://app.emutize.com
      - key: MAX_APK_MB
        value: "150"
