<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1022">
<title>星际桌面 · 网页电脑</title>
<style>
:root{--accent:#8b9cff;--accent-rgb:139,156,255;--text:#f5f7ff;--muted:#aeb8d7;--panel:rgba(19,27,54,.82);--panel-strong:rgba(18,25,49,.96);--stroke:rgba(255,255,255,.13);--shadow:0 24px 80px rgba(0,0,0,.38);--taskbar:rgba(7,12,29,.66)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:#080d1c}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit;border:0}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#desktop{position:relative;width:100%;height:100%;isolation:isolate;overflow:hidden;background:radial-gradient(ellipse at 72% 22%,rgba(118,83,218,.52),transparent 25%),radial-gradient(ellipse at 20% 76%,rgba(13,164,201,.24),transparent 35%),linear-gradient(135deg,#080d1c 0%,#111a39 48%,#17133b 100%)}
#desktop:before{content:"";position:absolute;inset:0;z-index:-2;opacity:.38;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:54px 54px;mask-image:linear-gradient(to bottom,black,transparent 90%)}
.aurora{position:absolute;z-index:-1;width:48vw;height:48vw;max-width:700px;max-height:700px;right:8%;top:5%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#97efff 0%,#5f7cf9 13%,#563b9e 35%,rgba(45,46,116,.48) 53%,transparent 70%);filter:blur(2px);opacity:.85;box-shadow:0 0 120px rgba(99,119,255,.28);pointer-events:none}
.planet-ring{position:absolute;z-index:-1;width:min(62vw,850px);height:min(20vw,260px);right:3%;top:28%;transform:rotate(-24deg);border:1px solid rgba(174,209,255,.28);border-radius:50%;box-shadow:0 0 35px rgba(133,153,255,.1),inset 0 0 35px rgba(133,153,255,.08);pointer-events:none}
.topbar{position:absolute;top:18px;left:24px;right:24px;display:flex;align-items:center;justify-content:space-between;z-index:2;pointer-events:none}.brand,.system-status{pointer-events:auto;display:flex;align-items:center;gap:10px}.brand-mark{width:35px;height:35px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#a6e7ff,#7e88ff 60%,#aa78ff);color:#10152c;font-weight:900;box-shadow:0 7px 25px rgba(118,145,255,.35)}.brand-name{font-weight:750;letter-spacing:.02em}.brand-sub{font-size:11px;color:var(--muted);margin-top:2px}.system-status{background:rgba(7,11,27,.34);border:1px solid var(--stroke);padding:9px 13px;border-radius:13px;backdrop-filter:blur(15px);font-size:12px;color:#dce5ff}.status-dot{width:7px;height:7px;border-radius:50%;background:#69e6b1;box-shadow:0 0 12px #69e6b1}
.desktop-icons{position:absolute;top:88px;left:18px;display:grid;grid-template-columns:repeat(1,78px);gap:10px;z-index:3}.desktop-icon{width:76px;min-height:82px;display:flex;align-items:center;justify-content:flex-start;flex-direction:column;gap:7px;padding:8px 4px;background:transparent;border:1px solid transparent;border-radius:14px;color:#eff3ff;text-shadow:0 1px 5px rgba(0,0,0,.45);font-size:12px;transition:.16s}.desktop-icon:hover,.desktop-icon:focus-visible{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.12)}.icon-art{width:43px;height:43px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.2);box-shadow:0 7px 22px rgba(0,0,0,.18);font-size:22px;backdrop-filter:blur(12px)}.desktop-welcome{position:absolute;left:clamp(112px,14vw,230px);top:25%;max-width:520px;pointer-events:none;z-index:0}.eyebrow{font-size:11px;letter-spacing:.19em;color:#b9c7ff;text-transform:uppercase;display:flex;align-items:center;gap:9px}.eyebrow:before{content:"";height:1px;width:26px;background:var(--accent)}.desktop-welcome h1{margin:17px 0 8px;font-size:clamp(31px,4vw,54px);letter-spacing:-.045em;line-height:1.08;font-weight:720}.desktop-welcome p{margin:0;color:#bac4e5;font-size:14px;line-height:1.9;max-width:385px}.welcome-chip{margin-top:22px;display:inline-flex;gap:9px;align-items:center;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);padding:8px 12px;border-radius:999px;font-size:11px;color:#d8dfff}
.widget-stack{position:absolute;right:25px;top:100px;width:220px;display:flex;flex-direction:column;gap:12px;z-index:1}.widget{border:1px solid rgba(255,255,255,.13);background:rgba(15,21,47,.38);backdrop-filter:blur(18px);border-radius:19px;padding:17px;box-shadow:0 14px 45px rgba(0,0,0,.08)}.widget-label{font-size:11px;color:#b6c1e6}.widget-time{font-size:31px;font-weight:650;letter-spacing:-.04em;margin:8px 0 2px;font-variant-numeric:tabular-nums}.widget-date{font-size:11px;color:#c4cbea}.weather-row{display:flex;align-items:center;justify-content:space-between;margin-top:12px}.weather-icon{font-size:28px}.weather-temp{font-size:23px;font-weight:650}.weather-caption{font-size:11px;color:#bcc8e9;line-height:1.6}.quick-row{display:flex;gap:7px;margin-top:12px}.quick-pill{font-size:10px;border:1px solid var(--stroke);background:rgba(255,255,255,.05);padding:6px 8px;border-radius:9px;color:#dce3ff}
.taskbar{position:absolute;bottom:13px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;align-items:center;gap:7px;padding:8px 10px;border:1px solid rgba(255,255,255,.15);border-radius:19px;background:var(--taskbar);backdrop-filter:blur(28px);box-shadow:0 15px 50px rgba(0,0,0,.35);max-width:calc(100vw - 18px)}.task-button{width:43px;height:43px;flex:0 0 auto;border-radius:13px;display:grid;place-items:center;background:transparent;font-size:20px;position:relative;transition:.16s}.task-button:hover,.task-button.active{background:rgba(255,255,255,.13)}.task-button.start-button{background:linear-gradient(145deg,#b9f0ff,#8298ff 65%,#c1a0ff);color:#11162f;font-size:19px}.task-button.running:after{content:"";position:absolute;bottom:3px;width:12px;height:3px;border-radius:99px;background:#c6d1ff}.task-separator{height:28px;width:1px;background:rgba(255,255,255,.14);margin:0 2px}.tray{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;padding:0 7px 0 9px;min-width:78px;font-size:10px;color:#dce4ff;line-height:1.5}.tray strong{font-weight:600;font-size:11px;font-variant-numeric:tabular-nums}
.start-menu{position:absolute;z-index:999;bottom:78px;left:50%;transform:translateX(-50%) translateY(12px);width:min(440px,calc(100vw - 24px));padding:19px;border-radius:24px;background:rgba(14,20,43,.94);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(32px);box-shadow:0 25px 90px rgba(0,0,0,.5);opacity:0;visibility:hidden;transition:.18s}.start-menu.open{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}.start-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.start-head b{font-size:16px}.profile{font-size:11px;color:#bbc6e6;padding:7px 10px;background:rgba(255,255,255,.06);border-radius:9px}.searchbox{width:100%;padding:12px 13px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.18);border-radius:12px;color:var(--text);outline:none}.searchbox::placeholder{color:#8f9bbc}.section-label{font-size:11px;color:#a7b3da;margin:19px 2px 10px}.app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.app-tile{padding:11px 4px;display:flex;flex-direction:column;align-items:center;gap:8px;background:transparent;border-radius:12px;font-size:11px;color:#e5eaff}.app-tile:hover{background:rgba(255,255,255,.08)}.app-tile .icon-art{width:38px;height:38px;font-size:19px}.start-footer{display:flex;justify-content:space-between;align-items:center;margin-top:17px;padding-top:13px;border-top:1px solid var(--stroke);font-size:11px;color:#b5c0e0}.small-action{padding:7px 10px;border-radius:9px;background:rgba(255,255,255,.07)}
.window{position:absolute;z-index:10;display:flex;flex-direction:column;overflow:hidden;min-width:290px;min-height:220px;width:min(720px,calc(100vw - 22px));height:min(500px,calc(100vh - 125px));top:12%;left:calc(50% - min(360px, 47vw));border:1px solid rgba(255,255,255,.18);border-radius:17px;background:var(--panel-strong);backdrop-filter:blur(32px);box-shadow:var(--shadow);animation:windowIn .19s ease-out}.window.hidden{display:none}.window.maximized{left:8px!important;top:8px!important;width:calc(100vw - 16px)!important;height:calc(100vh - 88px)!important;border-radius:15px}.window-titlebar{height:49px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;background:rgba(255,255,255,.035);border-bottom:1px solid rgba(255,255,255,.1);cursor:grab;touch-action:none;user-select:none}.window-titlebar:active{cursor:grabbing}.window-name{display:flex;align-items:center;gap:9px;font-weight:650;font-size:12px}.window-name span:first-child{font-size:16px}.window-controls{display:flex;gap:6px}.win-control{width:25px;height:25px;display:grid;place-items:center;border-radius:8px;background:rgba(255,255,255,.07);color:#dce4ff;font-size:12px}.win-control:hover{background:rgba(255,255,255,.16)}.win-control.close:hover{background:#ef6478;color:#fff}.window-content{flex:1;min-height:0;overflow:auto;padding:18px;color:#e9edff}.window-content::-webkit-scrollbar{width:7px}.window-content::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:9px}@keyframes windowIn{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
.panel-card{border:1px solid var(--stroke);background:rgba(255,255,255,.04);border-radius:13px;padding:15px}.muted{color:var(--muted)}.primary-btn{padding:9px 13px;border-radius:10px;background:linear-gradient(135deg,#90dfff,#8997ff);color:#11172f;font-weight:700;font-size:12px}.soft-btn{padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid var(--stroke);font-size:12px}.field{width:100%;padding:10px 12px;border-radius:10px;color:var(--text);background:rgba(0,0,0,.18);border:1px solid var(--stroke)}.field::placeholder{color:#929fbe}.notes-area{width:100%;height:calc(100% - 62px);min-height:220px;resize:none;border:0;outline:none;background:transparent;color:#f1f4ff;line-height:1.85;font-size:14px}.notes-meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#aebadc;padding-top:10px;border-top:1px solid var(--stroke)}
.calc{max-width:335px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.calc-display{grid-column:1/-1;padding:17px 14px;text-align:right;font-size:31px;overflow:hidden;white-space:nowrap;color:#f4f6ff;background:rgba(0,0,0,.2);border-radius:13px;margin-bottom:7px;font-variant-numeric:tabular-nums}.calc-key{min-height:48px;border-radius:12px;background:rgba(255,255,255,.08);font-size:16px}.calc-key:hover{background:rgba(255,255,255,.15)}.calc-key.operator{background:rgba(var(--accent-rgb),.24)}.calc-key.equal{background:linear-gradient(140deg,#a4e6ff,#8990ff);color:#141a35;font-weight:800}.calc-key.wide{grid-column:span 2}
.file-toolbar{display:flex;gap:7px;margin-bottom:17px}.file-toolbar button{padding:8px 11px;border-radius:9px;background:rgba(255,255,255,.07);font-size:11px}.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}.file-item{min-height:95px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid transparent;font-size:11px}.file-item:hover{background:rgba(255,255,255,.08);border-color:var(--stroke)}.file-item span:first-child{font-size:28px}
.browser-bar{display:flex;gap:7px;margin-bottom:14px}.browser-body{min-height:250px;border:1px solid var(--stroke);border-radius:13px;padding:19px;background:rgba(255,255,255,.025)}.browser-hero{padding:18px 0 25px;text-align:center}.browser-orb{font-size:43px;margin-bottom:10px}.browser-hero h2{margin:0 0 9px;font-size:25px}.browser-hero p{font-size:12px;color:#b8c3e3}.browser-links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.browser-link{padding:12px;border:1px solid var(--stroke);border-radius:11px;background:rgba(255,255,255,.04);text-align:left;font-size:12px}.browser-link small{display:block;color:#a9b6d9;margin-top:5px;font-size:10px}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--stroke)}.settings-row:last-child{border-bottom:0}.settings-row strong{display:block;font-size:12px}.settings-row p{margin:5px 0 0;font-size:11px;color:#aab6d7}.switch{width:42px;height:24px;padding:3px;border-radius:999px;background:#505a79;flex:0 0 auto;transition:.2s}.switch:after{content:"";display:block;width:18px;height:18px;border-radius:50%;background:white;transition:.2s}.switch.on{background:var(--accent)}.switch.on:after{transform:translateX(18px)}.color-dot{display:inline-block;width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.6);margin-left:6px;vertical-align:middle;cursor:pointer}.about-mark{font-size:54px;text-align:center;margin:15px}.about-title{text-align:center;font-size:23px;font-weight:750}.about-description{text-align:center;color:#b7c4e6;font-size:12px;line-height:1.8;max-width:420px;margin:10px auto 20px}.about-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.toast{position:absolute;bottom:83px;right:18px;z-index:1500;border:1px solid var(--stroke);background:rgba(16,24,49,.94);backdrop-filter:blur(15px);border-radius:12px;padding:11px 14px;font-size:12px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:760px){.topbar{left:15px;right:15px;top:13px}.system-status{font-size:10px;padding:8px 10px}.brand-sub{display:none}.desktop-icons{left:9px;top:75px;grid-template-columns:repeat(1,66px);gap:3px}.desktop-icon{width:64px;min-height:70px;font-size:10px}.icon-art{width:38px;height:38px;font-size:19px}.desktop-welcome{left:86px;top:25%;right:18px}.desktop-welcome h1{font-size:32px}.desktop-welcome p{font-size:12px}.welcome-chip{font-size:9px;margin-top:14px}.widget-stack{right:12px;top:auto;bottom:91px;width:155px;gap:7px}.widget{padding:12px;border-radius:15px}.widget-time{font-size:25px}.widget-date{font-size:9px}.weather-row{margin-top:6px}.weather-icon{font-size:22px}.weather-temp{font-size:19px}.weather-caption{font-size:9px}.quick-row{display:none}.taskbar{bottom:7px;padding:6px;gap:3px;border-radius:16px}.task-button{width:37px;height:39px;font-size:18px}.tray{min-width:56px;padding:0 4px;font-size:9px}.tray strong{font-size:10px}.task-separator{height:22px}.window{top:7%!important;left:8px!important;width:calc(100vw - 16px)!important;height:min(520px,calc(100vh - 105px))!important;border-radius:14px}.window.maximized{height:calc(100vh - 75px)!important}.window-titlebar{height:45px}.window-content{padding:13px}.start-menu{bottom:68px;padding:15px}.app-grid{grid-template-columns:repeat(4,1fr)}.browser-links{grid-template-columns:1fr}.toast{right:10px;bottom:74px}}
@media(max-height:520px){.desktop-welcome{top:24%}.desktop-welcome p{display:none}.welcome-chip{margin-top:11px}.widget-stack{top:73px;bottom:auto}.widget:nth-child(2){display:none}.desktop-icons{top:70px}.window{height:calc(100vh - 85px)!important;top:5%!important}.taskbar{bottom:4px}}
</style>
</head>
<body>
<div id="desktop" aria-label="星际桌面">
  <div class="aurora"></div><div class="planet-ring"></div>
  <header class="topbar"><div class="brand"><div class="brand-mark">✦</div><div><div class="brand-name">NEBULA OS</div><div class="brand-sub">你的网页电脑 · Browser Desktop</div></div></div><div class="system-status"><span class="status-dot"></span><span>系统运行正常</span><span style="opacity:.4">/</span><span id="top-date">本地桌面</span></div></header>
  <nav class="desktop-icons" aria-label="桌面应用">
    <button class="desktop-icon" data-app="files"><span class="icon-art">📁</span><span>文件</span></button>
    <button class="desktop-icon" data-app="browser"><span class="icon-art">🌐</span><span>浏览器</span></button>
    <button class="desktop-icon" data-app="notes"><span class="icon-art">📝</span><span>便签</span></button>
    <button class="desktop-icon" data-app="calculator"><span class="icon-art">🧮</span><span>计算器</span></button>
    <button class="desktop-icon" data-app="settings"><span class="icon-art">⚙️</span><span>设置</span></button>
    <button class="desktop-icon" data-app="about"><span class="icon-art">💻</span><span>关于电脑</span></button>
  </nav>
  <section class="desktop-welcome"><div class="eyebrow">A NEW DIGITAL SPACE</div><h1>欢迎回到<br>你的数字宇宙。</h1><p>这里是属于你的网页电脑。打开应用、整理想法，或者只是享受片刻安静。</p><div class="welcome-chip"><span>✧</span> 无需安装 · 在浏览器中运行 <span style="opacity:.45">•</span> v1.0</div></section>
  <aside class="widget-stack"><div class="widget"><div class="widget-label">LOCAL TIME · 本地时间</div><div class="widget-time" id="widget-time">--:--</div><div class="widget-date" id="widget-date">正在读取日期…</div></div><div class="widget"><div class="widget-label">YOUR SPACE</div><div class="weather-row"><div><div class="weather-temp">∞</div><div class="weather-caption">创造力没有边界<br>今天也值得期待。</div></div><div class="weather-icon">🌙</div></div><div class="quick-row"><span class="quick-pill">✦ 专注模式</span><span class="quick-pill">◉ 在线桌面</span></div></div></aside>
  <div id="window-layer" aria-live="polite"></div>
  <section class="start-menu" id="start-menu" aria-label="开始菜单"><div class="start-head"><b>所有应用</b><span class="profile">◉ 访客桌面</span></div><input class="searchbox" id="app-search" placeholder="搜索应用…" aria-label="搜索应用"><div class="section-label">已固定</div><div class="app-grid" id="start-app-grid"></div><div class="start-footer"><span>NEBULA OS · 网页版</span><button class="small-action" data-app="settings">⚙ 设置</button></div></section>
  <nav class="taskbar" aria-label="任务栏"><button class="task-button start-button" id="start-toggle" title="开始菜单" aria-label="打开开始菜单">✦</button><span class="task-separator"></span><button class="task-button" data-app="browser" title="浏览器" aria-label="打开浏览器">🌐</button><button class="task-button" data-app="files" title="文件" aria-label="打开文件">📁</button><button class="task-button" data-app="notes" title="便签" aria-label="打开便签">📝</button><button class="task-button" data-app="calculator" title="计算器" aria-label="打开计算器">🧮</button><div class="task-separator"></div><button class="task-button" id="desktop-show" title="显示桌面" aria-label="显示桌面">▱</button><div class="tray"><strong id="tray-time">--:--</strong><span id="tray-date">--/--</span></div></nav>
  <div class="toast" id="toast" role="status"></div>
</div>
<script>
(() => {
  'use strict';
  const $ = (selector, root=document) => root.querySelector(selector);
  const $$ = (selector, root=document) => [...root.querySelectorAll(selector)];
  const layer = $('#window-layer');
  const startMenu = $('#start-menu');
  const apps = {
    files:{name:'文件管理器',icon:'📁',build:buildFiles},
    browser:{name:'浏览器',icon:'🌐',build:buildBrowser},
    notes:{name:'便签',icon:'📝',build:buildNotes},
    calculator:{name:'计算器',icon:'🧮',build:buildCalculator},
    settings:{name:'系统设置',icon:'⚙️',build:buildSettings},
    about:{name:'关于电脑',icon:'💻',build:buildAbout}
  };
  let zIndex=20, windowCount=0, toastTimer;
  const windows = new Map();
  const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function notify(message){const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2200);}
  function updateClock(){const d=new Date();const time=d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});const date=d.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});$('#widget-time').textContent=time;$('#widget-date').textContent=date;$('#tray-time').textContent=time;$('#tray-date').textContent=d.toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'});$('#top-date').textContent=d.toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'});}
  updateClock();setInterval(updateClock,15000);
  function appCard(id){const a=apps[id];return `<button class="app-tile" data-app="${id}"><span class="icon-art">${a.icon}</span><span>${a.name}</span></button>`;}
  $('#start-app-grid').innerHTML=Object.keys(apps).map(appCard).join('');
  function focusWindow(win){zIndex++;win.style.zIndex=zIndex; $$('.window').forEach(w=>w.classList.toggle('focused',w===win));$$('.task-button[data-window]').forEach(b=>b.classList.toggle('active',b.dataset.window===win.dataset.app));}

<script>
// Prevent page-level pinch/double-tap zoom on touch devices. App window controls still work.
(function () {
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturechange', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('gestureend', function (e) { e.preventDefault(); }, { passive: false });
  let lastTouchEnd = 0;
  document.addEventListener('touchend', function (e) {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });
